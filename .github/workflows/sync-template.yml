name: Sync template

on:
  workflow_dispatch:
  repository_dispatch:
    types: [cookie-consent-released]

permissions:
  contents: write

env:
  SOURCE_REPO: 68publishers/cookie-consent
  SOURCE_FILE: gtm_template.tpl

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A release dispatch names its own tag; a manual run falls back to the latest release.
      - name: Resolve the release to sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAYLOAD_TAG: ${{ github.event.client_payload.tag }}
        run: |
          TAG="${PAYLOAD_TAG:-$(gh release view --repo $SOURCE_REPO --json tagName -q .tagName)}"
          gh release view --repo $SOURCE_REPO "$TAG" --json tagName > /dev/null
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Download the template
        run: |
          curl -fsSL "https://raw.githubusercontent.com/$SOURCE_REPO/$TAG/$SOURCE_FILE" -o template.tpl
          curl -fsSL "https://raw.githubusercontent.com/$SOURCE_REPO/$TAG/CHANGELOG.md" -o "$RUNNER_TEMP/CHANGELOG.md"
          grep -q '"categories"' template.tpl || { echo "::error::$SOURCE_FILE is missing the categories entry required by the Gallery"; exit 1; }

      - name: Commit the template
        run: |
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- template.tpl; then
            echo "Template is already up to date."
            echo "SKIP=1" >> $GITHUB_ENV
            exit 0
          fi
          git commit -m "chore: sync template from $TAG" -- template.tpl
          git push
          echo "SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      # The Gallery publishes only the commits listed here, newest first.
      # The change notes are the "[Template]" entries of the release in the changelog.
      - name: Record the version in metadata.yaml
        if: env.SKIP != '1'
        run: |
          python3 - <<'EOF'
          import os, re

          tag = os.environ["TAG"]
          version = tag.removeprefix("v")
          url = f"https://github.com/{os.environ['SOURCE_REPO']}/releases/tag/{tag}"

          notes, in_release = [], False
          with open(os.path.join(os.environ["RUNNER_TEMP"], "CHANGELOG.md"), encoding="utf-8") as f:
              for line in f:
                  if line.startswith("## "):
                      in_release = line.startswith(f"## [{version}]")
                  elif in_release:
                      match = re.match(r"- \[Template\]\s+(.+)", line.strip())
                      if match:
                          notes.append(match.group(1))

          if not notes:
              print(f"::warning::The changelog of {tag} has no [Template] entries, using a generic change note.")
              notes = [f"New release, see {url}"]

          entry = f'  - sha: "{os.environ["SHA"]}"\n    changeNotes: |2\n' + "".join(f"      {note}\n" for note in notes)

          with open("metadata.yaml", encoding="utf-8") as f:
              metadata = f.read()

          with open("metadata.yaml", "w", encoding="utf-8") as f:
              f.write(metadata.replace("versions:\n", "versions:\n" + entry, 1))
          EOF
          git commit -m "chore: record $TAG in metadata.yaml" -- metadata.yaml
          git push
