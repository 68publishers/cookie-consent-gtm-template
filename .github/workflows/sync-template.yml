name: Sync template

on:
  workflow_dispatch:
  repository_dispatch:
    types: [cookie-consent-released]

permissions:
  contents: write

env:
  SOURCE_REPO: 68publishers/cookie-consent
  SOURCE_FILE: gtm_template.tpl

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A release dispatch names its own tag; a manual run falls back to the latest release.
      - name: Resolve the release to sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAYLOAD_TAG: ${{ github.event.client_payload.tag }}
        run: |
          TAG="${PAYLOAD_TAG:-$(gh release view --repo $SOURCE_REPO --json tagName -q .tagName)}"
          gh release view --repo $SOURCE_REPO "$TAG" --json tagName > /dev/null
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Download the template
        run: |
          curl -fsSL "https://raw.githubusercontent.com/$SOURCE_REPO/$TAG/$SOURCE_FILE" -o template.tpl
          grep -q '"categories"' template.tpl || { echo "::error::$SOURCE_FILE is missing the categories entry required by the Gallery"; exit 1; }

      - name: Commit the template
        run: |
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- template.tpl; then
            echo "Template is already up to date."
            echo "SKIP=1" >> $GITHUB_ENV
            exit 0
          fi
          git commit -m "chore: sync template from $TAG" -- template.tpl
          git push
          echo "SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      # The Gallery publishes only the commits listed here, newest first.
      - name: Record the version in metadata.yaml
        if: env.SKIP != '1'
        run: |
          awk -v sha="$SHA" -v tag="$TAG" -v repo="$SOURCE_REPO" '
            { print }
            /^versions:$/ && !done {
              printf "  - sha: \"%s\"\n    changeNotes: \"%s - https://github.com/%s/releases/tag/%s\"\n", sha, tag, repo, tag
              done = 1
            }
          ' metadata.yaml > metadata.yaml.tmp && mv metadata.yaml.tmp metadata.yaml
          git commit -m "chore: record $TAG in metadata.yaml" -- metadata.yaml
          git push
